    <script>
      (function () {
        var k = "smc_theme";
        var s = localStorage.getItem(k);
        var dark =
          s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        if (dark) r.classList.add("dark");
        else r.classList.remove("dark");
        r.dataset.theme = s === "light" || s === "dark" ? s : "system";
      })();
    </script>
