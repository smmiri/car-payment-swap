<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title { font: 700 64px Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 28px Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .badge { font: 600 18px Inter, system-ui, sans-serif; fill: #ffffff; }
      .legend { font: 500 22px Inter, system-ui, sans-serif; fill: #475569; }
      .footer { font: 500 18px Inter, system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc"/>

  <g transform="translate(80, 80)">
    <rect x="0" y="32" width="80" height="40" rx="8" fill="#2563eb"/>
    <rect x="16" y="16" width="32" height="16" rx="4" fill="#059669"/>
    <circle cx="20" cy="72" r="8" fill="#0f172a"/>
    <circle cx="60" cy="72" r="8" fill="#0f172a"/>
  </g>

  <text class="title" x="80" y="240">SwapMyCar</text>
  <text class="subtitle" x="80" y="290">Canadian vehicle payment swap calculator</text>
  <text class="subtitle" x="80" y="328">All-in monthly cost · BC PST-116 · EV rebates · max budget</text>

  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="1040" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="60" y="40" width="80" height="100" fill="#2563eb" opacity="0.9"/>
    <rect x="60" y="100" width="80" height="40" fill="#7c3aed"/>
    <rect x="60" y="120" width="80" height="20" fill="#0891b2"/>
    <text class="legend" x="60" y="160">Keep</text>

    <rect x="220" y="60" width="80" height="80" fill="#2563eb" opacity="0.9"/>
    <rect x="220" y="110" width="80" height="30" fill="#7c3aed"/>
    <rect x="220" y="125" width="80" height="15" fill="#059669"/>
    <text class="legend" x="220" y="160">Low trade-in</text>

    <rect x="380" y="70" width="80" height="70" fill="#2563eb" opacity="0.9"/>
    <rect x="380" y="115" width="80" height="25" fill="#7c3aed"/>
    <rect x="380" y="128" width="80" height="12" fill="#059669"/>
    <text class="legend" x="380" y="160">Mid</text>

    <rect x="540" y="85" width="80" height="55" fill="#2563eb" opacity="0.9"/>
    <rect x="540" y="120" width="80" height="20" fill="#7c3aed"/>
    <rect x="540" y="130" width="80" height="10" fill="#059669"/>
    <text class="legend" x="540" y="160">High</text>

    <g transform="translate(720, 70)">
      <circle cx="0" cy="0" r="6" fill="#2563eb"/>
      <text class="legend" x="14" y="6">Loan</text>
      <circle cx="0" cy="32" r="6" fill="#7c3aed"/>
      <text class="legend" x="14" y="38">Insurance</text>
      <circle cx="0" cy="64" r="6" fill="#059669"/>
      <text class="legend" x="14" y="70">Fuel / elec</text>
    </g>
  </g>

  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#0f172a"/>
    <text class="badge" x="22" y="22">MIT - Open source</text>
  </g>

  <text class="footer" x="80" y="600">swapmycar.smmiri.com</text>
</svg>
