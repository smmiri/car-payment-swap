# Build the static site and publish to GitHub Pages.
# Canonical URL: https://swapmycar.smmiri.com/
#
# FIRST-TIME SETUP (fixes deploy 404):
#   Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Then re-run this workflow (Actions tab → Deploy to GitHub Pages → Run workflow).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build for GitHub Pages
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://swapmycar.smmiri.com
          VITE_REPO_URL: https://github.com/smmiri/car-payment-swap
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
